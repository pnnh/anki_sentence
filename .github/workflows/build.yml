name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            if ! [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag '$version' is not a semantic version (expected vMAJOR.MINOR.PATCH)." >&2
              exit 1
            fi
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Quality check
        run: |
          python scripts/qc.py \
            --data-dir data/sentences_polished \
            --report-dir reports_polished \
            --check-target \
            --fail-on-error

      - name: Quality check (grammar & narrative packs)
        run: |
          python scripts/qc.py \
            --data-dir data/packs/final \
            --report-dir reports_packs \
            --check-target \
            --fail-on-error

      - name: Coverage report and new-scene gate
        run: |
          python scripts/coverage.py \
            --report-dir reports_coverage \
            --gate-group 新生活场景 \
            --max-question-ratio 0.4 \
            --fail-on-gate

      - name: Build artifacts
        run: python scripts/build_release.py --version "${{ steps.version.outputs.version }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.apkg
            dist/*.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anki_sentence-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          case "${{ steps.version.outputs.version }}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
